services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: payload
      POSTGRES_DB: payload
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U payload -d payload']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      args:
        # NEXT_PUBLIC_SERVER_URL is inlined at build time — changing SERVER_URL
        # requires a rebuild, not just a restart.
        PAYLOAD_SECRET: ${PAYLOAD_SECRET:?set PAYLOAD_SECRET in .env}
        DATABASE_URL: postgres://payload:${POSTGRES_PASSWORD}@db:5432/payload
        NEXT_PUBLIC_SERVER_URL: ${SERVER_URL:?set SERVER_URL in .env}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://payload:${POSTGRES_PASSWORD}@db:5432/payload
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      NEXT_PUBLIC_SERVER_URL: ${SERVER_URL}
      NODE_ENV: production
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  media:
  caddy_data:
  caddy_config:
